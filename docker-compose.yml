# Local, fully free stack: FastAPI backend + React frontend + Ollama (local LLM).
# Run with:  docker compose up --build
version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build: ./backend
    ports:
      - "8000:7860"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:80"]
    volumes:
      - backend_storage:/app/storage
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ollama_data:
  backend_storage:
